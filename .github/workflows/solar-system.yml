
name: solar system workflow

on:
    workflow_dispatch: 
    push:
        branches: 
            - main
            - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
jobs:
    unit-testing:
        name: unit-testing
        runs-on: ubuntu-latest
        steps:
        - name: checkout repository
          uses: actions/checkout@v4

        - name : setup nodejs version 18
          uses: actions/setup-node@v3
          with:
            node-version: '18'
        
        - name: Install dependencies
          run: npm install
        - name: Run tests
          id: nodejs-unit-testing-step
          run: npm test
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Dinesh-Unit-Testing
            path: dinesh-unit-testing-results.xml
    code-coverage:
        name: code-coverage
        runs-on: ubuntu-latest
        steps:
        - name: checkout repository
          uses: actions/checkout@v4

        - name: setup nodejs version 18
          uses: actions/setup-node@v3
          with:
            node-version: '18'
        - name: Install Dependencies
          run: npm install

        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage
    
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 3
    docker:
        name: containerization
        runs-on: ubuntu-latest
        needs: [unit-testing,code-coverage]
        steps:
        - name: checkout repo
          uses: actions/checkout@v4
        - name: Login to Docker Hub
          uses: docker/login-action@v3 # Use the latest stable version
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}
        - name: Docker Build For Testing
          uses: docker/build-push-action@v5
          continue-on-error: true
          with:
            context: .
            push: false
            tags:  ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
                -p 3000:3000
                -e MONGO_URI=$(MONGO_URI) \
                -e MONGO_USERNAME = $(MONGO_USERNAME) \
                -e MONGO_PASSWORD = $(MONGO_PASSWORD) \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
            export IP= $(docker inspect -f '{{range.Networksettings.Network}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo "Testing the Image Url using wget"
            wget -q -O -127.0.0.1:3000/live | grep live
    




